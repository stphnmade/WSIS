name: Refresh WSIS data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

concurrency:
  group: wsis-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Refresh source data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python -m wsis.data.refresh
      - name: Rebuild and verify profiles
        run: |
          python scripts/rebuild_city_profiles.py
          python -m pytest -q
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/raw data/processed; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "wsis-data-bot"
          git config user.email "wsis-data-bot@users.noreply.github.com"
          git add data/raw data/processed
          git commit -m "data: refresh WSIS sources"
          git push
